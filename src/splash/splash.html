<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<!-- Pagina isolada, sem rede e sem imagem externa: so recebe eventos do
     processo principal e desenha texto/barra. Ver
     docs/superpowers/specs/2026-09-12-abertura-com-atualizacao-design.md. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'" />
<title>GoLive LAN</title>
<link rel="stylesheet" href="splash.css" />
</head>
<body>
  <!-- Mesma marca de src/renderer/index.html (.app-brand-mark) -- copiada
       aqui porque HTML puro nao tem include. Se a marca mudar la, mudar
       aqui tambem. -->
  <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
    <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
      <path d="M20.71 14.20 L11.35 9.06" />
      <path d="M20.71 17.80 L11.35 22.94" />
      <circle cx="8.5" cy="7.5" r="3.25" />
      <circle cx="8.5" cy="24.5" r="3.25" />
    </g>
    <circle class="brand-origin" cx="24" cy="16" r="3.75" />
  </svg>

  <p id="status-text" class="status-text">Abrindo…</p>

  <div id="progress" class="progress indeterminate">
    <div id="progress-fill" class="progress-fill"></div>
  </div>

  <script src="splash.js"></script>
</body>
</html>

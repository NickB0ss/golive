<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy"
  content="default-src 'none'; media-src blob: mediastream:; style-src 'unsafe-inline'; font-src 'self'; script-src 'self'" />
<title>Espiar</title>
<style>
  @font-face {
    font-family: 'Instrument Sans';
    font-style: normal;
    font-weight: 400 700;
    font-display: swap;
    src: url('assets/fonts/instrumentsans-latin.woff2') format('woff2');
  }
  @font-face {
    font-family: 'IBM Plex Mono';
    font-style: normal;
    font-weight: 500 700;
    font-display: swap;
    src: url('assets/fonts/plexmono-500-latin.woff2') format('woff2');
  }
  /* Padrao = tema GoLive. O tema escolhido chega da janela principal
     (espiar.js, SPY_THEME_VARS) e sobrescreve estes valores inline. */
  :root {
    --spy-bg: #0C0D0F;
    --spy-fg: #ECEDEF;
    --spy-muted: #A4ABB4;
    --spy-s2: #1A1D21;
    --spy-s3: #23272C;
    --spy-act: #ECEDEF;
    --spy-on-act: #0C0D0F;
  }
  * { box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--spy-bg);
    color: var(--spy-fg);
    font: 13px 'Instrument Sans', system-ui, sans-serif;
  }
  #video { width: 100%; height: 100%; object-fit: contain; background: var(--spy-bg); }
  .tile-bar {
    position: fixed;
    inset: 0 0 auto;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 8px;
    height: 36px;
    padding: 0 8px 0 12px;
    background: var(--spy-s2);
    -webkit-app-region: drag;
  }
  .spy-tally {
    padding: 2px 6px;
    border-radius: 3px;
    background: #FF4D4F;
    color: #FFFFFF;
    font: 700 11px 'IBM Plex Mono', monospace;
    letter-spacing: .06em;
  }
  #tile-name { overflow: hidden; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
  #close {
    width: 28px;
    height: 28px;
    min-height: 28px;
    margin-left: auto;
    padding: 0;
    border: 0;
    border-radius: 999px;
    background: var(--spy-s3);
    color: var(--spy-fg);
    cursor: pointer;
    -webkit-app-region: no-drag;
  }
  #close:hover { background: var(--spy-act); color: var(--spy-on-act); }
  button:focus-visible { outline: 2px solid var(--spy-act); outline-offset: 2px; }
  #state { position: fixed; inset: auto 0 0; padding: 10px; text-align: center; background: var(--spy-bg); color: var(--spy-muted); display: none; }
  #state.visible { display: block; }
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<header class="tile-bar">
  <span class="spy-tally">AO VIVO</span>
  <span id="tile-name">Transmissão</span>
  <button id="close" type="button" aria-label="Fechar Espiar" title="Fechar Espiar">
    ×
  </button>
</header>
<div id="state" role="status"></div>
<script src="espiar.js"></script>
<script src="espiar-page.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy"
  content="default-src 'none'; media-src blob: mediastream:; style-src 'unsafe-inline'; font-src 'self'; script-src 'self'" />
<title data-i18n="pagina.espiar">Espiar</title>
<style>
  @font-face {
    font-family: 'Atkinson Hyperlegible Next';
    font-weight: 400;
    font-display: swap;
    src: url('assets/fonts/atkinson-next-400-latin.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Atkinson Hyperlegible Next';
    font-weight: 700;
    font-display: swap;
    src: url('assets/fonts/atkinson-next-700-latin.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Sora';
    font-weight: 600;
    font-display: swap;
    src: url('assets/fonts/sora-600-latin.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Geist Mono';
    font-weight: 500;
    font-display: swap;
    src: url('assets/fonts/geistmono-500-latin.woff2') format('woff2');
  }
  /* Padrao = tema GoLive. O tema escolhido chega da janela principal
     (espiar.js, SPY_THEME_VARS) e sobrescreve estes valores inline. */
  :root {
    --spy-bg: #0E0E14;
    --spy-fg: #EDEDF2;
    --spy-muted: #B4B4C3;
    --spy-s2: #1C1C26;
    --spy-s3: #262632;
    --spy-act: #EDEDF2;
    --spy-on-act: #0E0E14;
    --font-body: 'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif;
    --font-display: 'Sora', 'Segoe UI', system-ui, sans-serif;
    --font-mono: 'Geist Mono', 'Cascadia Mono', Consolas, monospace;
    --spy-live: #FF4D4F;
    --spy-on-live: #0E0E14; /* tinta sobre o vermelho (5,9:1), como no app */
    --z-tile-bar: 2;
  }
  * { box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--spy-bg);
    color: var(--spy-fg);
    font: 13px var(--font-body);
  }
  #video { width: 100%; height: 100%; object-fit: contain; background: var(--spy-bg); }
  .tile-bar {
    position: fixed;
    inset: 0 0 auto;
    z-index: var(--z-tile-bar);
    display: flex;
    align-items: center;
    gap: 6px;
    height: 32px;
    padding: 0 8px 0 12px;
    background: linear-gradient(to bottom, var(--spy-s2), transparent);
    opacity: 0;
    pointer-events: none;
    transition: opacity 120ms ease-out;
    -webkit-app-region: drag;
  }
  body.spy-controls .tile-bar, .tile-bar:focus-within {
    opacity: 1;
    pointer-events: auto;
  }
  .spy-node {
    width: 16px;
    height: 16px;
    border: 2px solid var(--spy-act);
    border-radius: 50%;
    color: var(--spy-live);
    background: var(--spy-bg);
  }
  #tile-name {
    overflow: hidden;
    color: var(--spy-muted);
    font: 700 13px/1.3 var(--font-display);
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #close {
    width: 24px;
    height: 24px;
    min-height: 24px;
    margin-left: auto;
    padding: 0;
    border: 0;
    border-radius: 6px;
    background: var(--spy-s3);
    color: var(--spy-fg);
    font: 500 14px/1 var(--font-mono);
    cursor: pointer;
    -webkit-app-region: no-drag;
  }
  #close:hover { background: var(--spy-act); color: var(--spy-on-act); }
  button:focus-visible { outline: 2px solid var(--spy-act); outline-offset: 2px; }
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<header class="tile-bar">
  <span class="spy-node" aria-hidden="true"></span>
  <span id="tile-name" data-i18n="pagina.transmissao">Transmissão</span>
  <button id="close" type="button" aria-label="Fechar Espiar" title="Fechar Espiar"
          data-i18n-attr="aria-label:pagina.fecharEspiar;title:pagina.fecharEspiar">
    <span data-i18n="pagina.simboloFechar">×</span>
  </button>
</header>
<script src="i18n/pt-BR.js"></script>
<script src="i18n/en.js"></script>
<script src="i18n/es.js"></script>
<script src="i18n/index.js"></script>
<script src="espiar.js"></script>
<script src="espiar-page.js"></script>
</body>
</html>

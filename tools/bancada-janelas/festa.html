<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Bancada das janelas da Festa</title>
<!-- Bancada de desenvolvimento, nao e pagina do app. Igual ao index.html
     desta pasta (mesma bancada.js), com as janelas do time Festa (jam, sons,
     link) e a ponte `window.golive` simulada so no que elas usam. Ver festa.js. -->
<link rel="stylesheet" href="../../src/renderer/style.css">
<link rel="stylesheet" href="../../src/renderer/mesa-janelas.css">
<style>
  body { overflow: auto; user-select: auto; padding: var(--s-4); }
  #titulo { margin: 0 0 var(--s-3); font: 700 var(--fs-lead) 'Outfit', system-ui, sans-serif; color: var(--tx2); }
  #palco { display: flex; gap: var(--s-5); align-items: flex-start; flex-wrap: wrap; }
  .pessoa h2 { margin: 0 0 var(--s-2); font-size: var(--fs-small); font-weight: 600; color: var(--tx2); }
  .janela { position: relative; background: var(--s1); border-radius: var(--r-lg); box-shadow: 0 0 0 1px var(--line2); overflow: hidden; }
  .conteudo { position: absolute; inset: 0; container-type: size; overflow: hidden; }
  .alca { position: absolute; left: 0; right: 0; top: 0; height: 28px; z-index: 4; display: grid; place-items: center; pointer-events: none; }
  .alca::after { content: ""; width: 36px; height: 4px; border-radius: 2px; background: var(--tx3); opacity: 0.5; }
</style>
<script>
  // A ponte do app, so no que as janelas da Festa usam: abrir link no
  // navegador. Aqui so anota o pedido (festa.js confere).
  window.linksAbertos = [];
  window.golive = {
    abrirLinkDaMesa: async (tipo, url) => {
      window.linksAbertos.push([tipo, url]);
      return { ok: true };
    },
  };
  // Sons: cada som tocado monta um compressor (mesa-janelas/sons.js,
  // `tocar`); contar os compressores e contar os sons que tocaram.
  window.sonsTocados = 0;
  if (window.AudioContext) {
    const criar = AudioContext.prototype.createDynamicsCompressor;
    AudioContext.prototype.createDynamicsCompressor = function () {
      window.sonsTocados++;
      return criar.call(this);
    };
  }
</script>
</head>
<body>
<h1 id="titulo"></h1>
<div id="palco"></div>

<script src="../../src/renderer/annotate.js"></script>
<script src="../../src/renderer/mesa-modules/jam.js"></script>
<script src="../../src/renderer/mesa-modules/sons.js"></script>
<script src="../../src/renderer/mesa-modules/link.js"></script>

<script src="../../src/renderer/mesa-janelas/comum.js"></script>
<script src="../../src/renderer/mesa-janelas/jam.js"></script>
<script src="../../src/renderer/mesa-janelas/sons.js"></script>
<script src="../../src/renderer/mesa-janelas/link.js"></script>

<script src="bancada.js"></script>
</body>
</html>

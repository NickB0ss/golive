name: release

# Dispara na tag. O electron-builder sobe os artefatos num release em
# RASCUNHO (padrao do provider github em package.json), entao publicar
# continua sendo um clique manual, como sempre foi aqui. O job 'conferir'
# roda depois desse clique.
#
# Desde 2026-10-02 os instaladores sobem no repositorio PUBLICO
# NickB0ss/golive-releases (o golive, com o codigo, ficou privado). O
# GITHUB_TOKEN nao escreve em outro repositorio, entao o upload usa o secret
# RELEASES_TOKEN: um fine-grained PAT com Contents: write SO no golive-releases.
on:
  push:
    tags: ['v*']
  # Release publicado AQUI (espelho da release ponte, ver abaixo).
  release:
    types: [published]
  # O evento 'release' do golive-releases nao chega neste repositorio: depois
  # de publicar la, rode este workflow na mao (Actions > release > Run
  # workflow) com a tag, para o job 'conferir'.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag publicada no golive-releases (ex.: v0.23.0)'
        required: true

jobs:
  publicar:
    if: github.event_name == 'push'
    # windows-2022 e nao -latest: o -latest passou a trazer o VS 2026, que o
    # node-gyp 11 nao reconhece ("unknown version") e o configure falha.
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # A tag e o package.json tem que contar a mesma historia: ja houve dois
      # commits 'sync package-lock' so pra consertar versao fora de sincronia.
      - name: a tag bate com o package.json?
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}" -replace '^v',''
          if ($v -ne $tag) { throw "tag $tag != package.json $v" }

      # Sem scripts: com eles o npm dispara um node-gyp rebuild implicito sem
      # o patch de toolset do build:native. O electron-builder baixa o proprio
      # Electron, nao usa o binario de node_modules/electron.
      - run: npm ci --ignore-scripts

      # Portao: nada de publicar tag de commit reprovado -- as sete releases
      # anteriores a 0.17.0 sairam todas com o CI vermelho.
      - run: npm run lint
      - run: npm test

      - run: npm run build:native

      # O beforeBuild (scripts/check-native-build.js) reprova aqui se o .node
      # nao existir, entao o instalador nunca sai sem a captura de audio.
      #
      # --publish never, e nao always: o electron-builder 26 roda o publisher
      # do GitHub duas vezes e deixa DOIS rascunhos na mesma tag -- um com o
      # .exe e o latest.yml, outro so com o .blockmap. Juntar os dois na mao
      # custou, nas duas ultimas releases, mais tempo que o build inteiro, e
      # numa delas o download do .blockmap falhou depois de eu ja ter apagado
      # o rascunho duplicado, obrigando a refazer tudo. Aqui os tres arquivos
      # saem de um build so e sobem juntos, pelo gh, num rascunho unico.
      - run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: o instalador, o latest.yml e o addon nativo estao la?
        shell: pwsh
        run: |
          if (!(Test-Path dist/latest.yml)) { throw "latest.yml ausente -- foi o que quebrou a atualizacao na v0.10.0" }
          if (!(Get-ChildItem dist -Filter '*.exe')) { throw "instalador ausente" }
          # Mesma assercao do job 'empacotar' do ci.yml: o `files` do
          # electron-builder e lista de globs, e glob que nao casa nada nao e
          # erro -- sem isto o instalador sai calado sem a captura de audio
          # por processo (P0-5 da auditoria de 2026-09-18).
          $addon = 'dist/win-unpacked/resources/app.asar.unpacked/build/Release/golive_audio.node'
          if (!(Test-Path $addon)) { throw "addon nativo ausente do pacote -- o instalador sairia sem captura de audio por processo" }

      # Um rascunho so, com os tres arquivos do MESMO build. Publicar continua
      # sendo clique manual:
      #   gh release edit <tag> --repo NickB0ss/golive-releases --draft=false --latest
      # Se a tag ja tiver um rascunho (re-execucao do workflow), reaproveita.
      #
      # ESPELHO_NO_GOLIVE: a RELEASE PONTE. Quem esta numa versao antiga tem
      # o updater apontando pro golive; enquanto ele ainda e publico, o mesmo
      # rascunho sobe tambem aqui, para essas pessoas receberem a versao que
      # ja busca no golive-releases. Depois que o golive virar privado, mude
      # para 'false' -- ninguem de fora consegue mais ler os releases daqui.
      - name: subir os artefatos num rascunho unico
        shell: pwsh
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          GITHUB_TOKEN_LOCAL: ${{ secrets.GITHUB_TOKEN }}
          ESPELHO_NO_GOLIVE: 'true'
        run: |
          if (-not $env:RELEASES_TOKEN) { throw "secret RELEASES_TOKEN ausente -- sem ele nao ha como subir no golive-releases" }
          $tag = "${{ github.ref_name }}"
          $arquivos = @(
            (Get-ChildItem dist -Filter '*.exe' | Select-Object -First 1).FullName,
            (Get-ChildItem dist -Filter '*.exe.blockmap' | Select-Object -First 1).FullName,
            (Resolve-Path dist/latest.yml).Path
          )

          function Subir($repo, $token, $alvo) {
            $env:GH_TOKEN = $token
            gh release view $tag --repo $repo *> $null
            if ($LASTEXITCODE -eq 0) {
              gh release upload $tag $arquivos --repo $repo --clobber
            } else {
              # O golive-releases nao tem o codigo: a tag nasce la apontando
              # pro commit padrao dele, nao pro sha deste repositorio.
              $extra = @()
              if ($alvo) { $extra = @('--target', $alvo) }
              gh release create $tag --repo $repo --draft @extra --title $tag.TrimStart('v') --notes "Rascunho gerado pelo workflow de release. Edite as notas antes de publicar." $arquivos
            }
            if ($LASTEXITCODE -ne 0) { throw "falha ao subir os artefatos em $repo" }
          }

          Subir 'NickB0ss/golive-releases' $env:RELEASES_TOKEN $null
          if ($env:ESPELHO_NO_GOLIVE -eq 'true') {
            Subir '${{ github.repository }}' $env:GITHUB_TOKEN_LOCAL '${{ github.sha }}'
          }

  # release:check existe desde o incidente da v0.10.0 (release sem latest.yml
  # derrubou a atualizacao de todas as versoes anteriores) e nunca era
  # chamado por ninguem. Aqui ele roda contra o release ja publicado, que e
  # quando o electron-updater de fato le os assets.
  conferir:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      # Rodado na mao: confere o golive-releases (o que o updater novo le).
      # Disparado pelo release daqui: confere o espelho da release ponte.
      - run: npm run release:check ${{ github.event.inputs.tag || github.event.release.tag_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOLIVE_RELEASES_REPO: ${{ github.event_name == 'release' && github.repository || 'NickB0ss/golive-releases' }}

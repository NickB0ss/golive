<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Protótipo de design (dados simulados), não é código do app. Abrir direto no navegador.
     Spec: docs/superpowers/specs/2026-09-24-sala-em-dois-modos-design.md -->
<title>Sala em dois modos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Work+Sans:wght@400;500;600&display=swap">
<style>
/* Tokens do tema "marca" do GoLive (src/renderer/style.css). Único de propósito: o app é escuro. */
:root {
  color-scheme: dark;
  --bg: #0A0A0F; --s1: #101018; --s2: #16161F; --s3: #1E1E2A; --s4: #292936;
  --grid: rgba(237,237,242,.045); --grid2: rgba(237,237,242,.09);
  --line: rgba(237,237,242,.08); --line2: rgba(237,237,242,.14);
  --tx: #EDEDF2; --tx2: #A3A3B8; --tx3: #9292AB;
  --act: #5B4BE8; --act-hover: #6D5CF6; --on-text: #A99BFF;
  --live: #FF4D4F; --danger: #C92A33; --danger-soft: #FF8385;
  --r-md: 10px; --r-lg: 14px; --r-full: 999px;
  --shadow-2: 0 8px 24px rgba(0,0,0,.4); --shadow-3: 0 24px 60px rgba(0,0,0,.6);
  --ease-out: cubic-bezier(.2,.8,.2,1); --ease-move: cubic-bezier(.3,.7,.2,1);
  --f-display: 'Outfit', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'Work Sans', 'Segoe UI', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--tx); font: 14px/1.45 var(--f-body); overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 0; box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--on-text); }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }

/* ---------- Barra do topo ---------- */
.top { position: fixed; left: 0; right: 0; top: 0; height: 56px; padding: 0 16px; z-index: 60; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; pointer-events: none; }
.top > * { pointer-events: auto; }
body[data-mode="mesa"] .top { background: linear-gradient(rgba(10,10,15,.9), rgba(10,10,15,0)); }
.room { display: flex; align-items: center; gap: 8px; min-width: 0; white-space: nowrap; }
.room .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--live); flex: none; }
.room b { font: 700 15px var(--f-display); }
.room small { color: var(--tx2); font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
.mode { display: flex; padding: 3px; gap: 2px; border-radius: var(--r-full); background: var(--s2); box-shadow: inset 0 0 0 1px var(--line); }
.mode button { height: 32px; padding: 0 14px; border-radius: var(--r-full); font-weight: 600; font-size: 13px; color: var(--tx2); display: inline-flex; align-items: center; gap: 6px; }
.mode button svg.i { width: 15px; height: 15px; }
.mode button[aria-checked="true"] { background: var(--s4); color: var(--tx); }
.mode button:not([aria-checked="true"]):hover { color: var(--tx); }
.top-r { justify-self: end; display: flex; align-items: center; gap: 6px; }
.avatars { display: flex; }
.av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 700 12px var(--f-display); color: #0A0A0F; flex: none; }
.avatars .av { margin-left: -6px; box-shadow: 0 0 0 2px var(--bg); }
.avatars button.av:hover { transform: translateY(-2px); }
.icon-btn { width: 36px; height: 36px; border-radius: var(--r-md); display: grid; place-items: center; color: var(--tx2); }
.icon-btn:hover, .icon-btn[aria-expanded="true"] { background: var(--s2); color: var(--tx); }

/* ---------- Modo Transmissão (o de hoje) ---------- */
.tx { position: fixed; top: 56px; bottom: 88px; left: 16px; right: 16px; display: grid; grid-template-columns: 1fr auto; gap: 12px; }
.stage { display: grid; grid-template-rows: 1fr auto; gap: 12px; min-width: 0; min-height: 0; }
.stage-main { container-type: size; display: grid; place-items: center; min-height: 0; }
.tile { position: relative; border-radius: var(--r-lg); overflow: hidden; background: var(--s1); }
.stage-main .tile { width: min(100cqw, 100cqh * 16 / 9); aspect-ratio: 16 / 9; }
.strip { display: flex; justify-content: center; gap: 12px; height: 120px; }
.strip .tile { height: 100%; aspect-ratio: 16 / 9; }
.stage-empty { color: var(--tx2); text-align: center; }
.col { width: 320px; min-height: 0; background: var(--s1); border-radius: var(--r-lg); box-shadow: inset 0 0 0 1px var(--line); display: flex; flex-direction: column; overflow: hidden; }
.tile .fs { position: absolute; top: 8px; right: 8px; z-index: 3; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: rgba(10,10,15,.72); color: var(--tx2); opacity: 0; transition: opacity 140ms; }
.tile:hover .fs, .tile:focus-within .fs { opacity: 1; }
.tile .fs svg.i { width: 16px; height: 16px; }

/* ---------- Modo Mesa ---------- */
.mv { position: fixed; inset: 0; overflow: hidden; cursor: default; touch-action: none; }
.mv.panning { cursor: grabbing; }
.grid-bg { position: absolute; inset: 0; pointer-events: none; }
.world { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; }
.world-edge { position: absolute; left: 0; top: 0; border-radius: 40px; box-shadow: 0 0 0 1px var(--line); pointer-events: none; }

.win { position: absolute; left: 0; top: 0; border-radius: var(--r-lg); background: var(--s1); overflow: hidden; transform: translate(var(--x), var(--y)); box-shadow: 0 0 0 1px var(--line2); transition: box-shadow 160ms var(--ease-out); }
.win.anim { transition: transform 260ms var(--ease-move), box-shadow 160ms; }
.win.remote-anim { transition: transform 900ms var(--ease-move), box-shadow 160ms; }
.win.lifted { box-shadow: 0 0 0 1px var(--on-text); opacity: .92; }
.landing { position: absolute; border-radius: var(--r-lg); border: 1.5px dashed var(--on-text); background: color-mix(in srgb, var(--act) 8%, transparent); pointer-events: none; }
.win.remote { box-shadow: 0 0 0 2px var(--who); }
.win.enter { animation: enter 220ms var(--ease-out); }
@keyframes enter { from { opacity: 0; scale: .94; } }
.win.video { cursor: grab; }
.win:fullscreen { border-radius: 0; transform: none; width: 100vw !important; height: 100vh !important; }
.win:fullscreen .edge, .win:fullscreen .grab { display: none; }
.content { position: absolute; inset: 0; }
.grab { position: absolute; left: 0; right: 0; top: 0; height: 28px; z-index: 4; cursor: grab; display: grid; place-items: center; }
.grab::after { content: ""; width: 36px; height: 4px; border-radius: 2px; background: var(--tx3); opacity: 0; transition: opacity 140ms; }
.ctrls { position: absolute; top: 8px; right: 8px; z-index: 5; display: flex; align-items: center; gap: 2px; padding: 2px; border-radius: var(--r-full); background: rgba(10,10,15,.75); opacity: 0; transition: opacity 140ms; }
.ctrls button { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: var(--tx2); }
.ctrls button:hover { background: var(--s4); color: var(--tx); }
.ctrls svg.i { width: 16px; height: 16px; }
.ctrls .av { width: 22px; height: 22px; font-size: 10px; margin: 0 4px 0 2px; }
.win:hover .ctrls, .win:focus-within .ctrls, .win:hover .grab::after, .win:focus-within .grab::after { opacity: 1; }
.win.remote .who-moving { opacity: 1; }
.who-moving { position: absolute; left: 10px; top: 8px; z-index: 5; padding: 3px 10px; border-radius: var(--r-full); background: var(--who); color: #0A0A0F; font-weight: 600; font-size: 12px; opacity: 0; pointer-events: none; }
body.idle .ctrls, body.idle .grab::after { opacity: 0 !important; }
.edge { position: absolute; z-index: 6; }
.edge.r { top: 14px; bottom: 14px; right: 0; width: 10px; cursor: ew-resize; }
.edge.l { top: 14px; bottom: 14px; left: 0; width: 10px; cursor: ew-resize; }
.edge.b { left: 14px; right: 14px; bottom: 0; height: 10px; cursor: ns-resize; }
.edge.br { right: 0; bottom: 0; width: 20px; height: 20px; cursor: nwse-resize; }
.edge.bl { left: 0; bottom: 0; width: 20px; height: 20px; cursor: nesw-resize; }

.cursor { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 99998; transform-origin: 0 0; transition: opacity 300ms; }
.cursor svg { width: 20px; height: 20px; display: block; }
.cursor span { position: absolute; left: 14px; top: 16px; padding: 2px 8px; border-radius: var(--r-full); background: var(--who); color: #0A0A0F; font-weight: 600; font-size: 12px; white-space: nowrap; }

/* Conteúdo das janelas */
.label { position: absolute; left: 12px; bottom: 10px; z-index: 3; display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; text-shadow: 0 1px 3px rgba(0,0,0,.9); pointer-events: none; }
.label .live { font: 700 11px var(--f-display); letter-spacing: .06em; color: #fff; background: var(--live); padding: 2px 7px; border-radius: var(--r-full); text-shadow: none; }
.screen-fake { position: absolute; inset: 0; background: radial-gradient(120% 90% at 70% 110%, #3A2A1A 0%, transparent 55%), linear-gradient(180deg, #1D2F45 0%, #2E4A5E 45%, #4B5A3A 46%, #2F3A24 100%); }
.screen-fake.mine { background: radial-gradient(90% 90% at 30% 20%, #2A2F5E 0%, transparent 60%), linear-gradient(180deg, #151A2E, #0E1020); }
.hud-map { position: absolute; left: 3%; top: 6%; width: 15%; aspect-ratio: 1; border-radius: 8px; background: rgba(10,10,15,.55); box-shadow: inset 0 0 0 2px rgba(237,237,242,.25); }
.hud-hp { position: absolute; right: 3%; bottom: 7%; width: 22%; height: 3.4%; border-radius: 4px; background: rgba(10,10,15,.6); overflow: hidden; }
.hud-hp::after { content: ""; position: absolute; inset: 0; width: 72%; background: #4ADE80; }
.xhair { position: absolute; left: 50%; top: 52%; width: 22px; height: 22px; margin: -11px; border: 2px solid rgba(237,237,242,.8); border-radius: 50%; }
.cam { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(90% 90% at 50% 30%, color-mix(in srgb, var(--who) 24%, var(--s2)), var(--s1)); }
.cam .face { width: 34%; aspect-ratio: 1; border-radius: 50%; background: var(--who); display: grid; place-items: center; font: 700 clamp(14px, 3.5vw, 40px) var(--f-display); color: #0A0A0F; }
.yt { position: absolute; inset: 0; background: radial-gradient(80% 120% at 20% 100%, #3B2A63 0%, transparent 60%), radial-gradient(70% 90% at 90% 10%, #173C4F 0%, transparent 60%), #0F0B1A; display: grid; place-items: center; }
.yt-play { width: 64px; height: 64px; border-radius: 50%; background: rgba(10,10,15,.72); display: grid; place-items: center; transition: opacity 160ms; }
.yt-play svg.i { width: 26px; height: 26px; fill: #fff; stroke: none; }
.yt.playing .yt-play { opacity: 0; }
.yt:hover .yt-play { opacity: 1; }
.yt-bar { position: absolute; left: 12px; right: 12px; bottom: 36px; height: 4px; border-radius: 2px; background: rgba(237,237,242,.2); }
.yt-bar i { position: absolute; inset: 0 auto 0 0; border-radius: 2px; background: var(--tx); }
.yt-time { font-variant-numeric: tabular-nums; font-weight: 500; color: var(--tx2); }
.game { position: absolute; inset: 0; padding: 30px 14px 14px; display: flex; flex-direction: column; align-items: center; gap: 10px; container-type: size; }
.game-status { font: 600 14px var(--f-display); color: var(--tx2); min-height: 20px; }
.game-status b { color: var(--tx); }
.board-wrap { flex: 1; min-height: 0; width: 100%; container-type: size; display: grid; place-items: center; }
.board { width: min(100cqw, 100cqh); aspect-ratio: 1; display: grid; grid-template: repeat(8, 1fr) / repeat(8, 1fr); border-radius: 8px; overflow: hidden; }
.sq { display: grid; place-items: center; font-size: calc(min(100cqw, 100cqh) / 8 * .78); line-height: 1; user-select: none; }
.sq.l { background: #34344A; } .sq.d { background: #23232F; }
.sq.last { background-image: linear-gradient(color-mix(in srgb, var(--act) 40%, transparent), color-mix(in srgb, var(--act) 40%, transparent)); }
.sq.sel { box-shadow: inset 0 0 0 3px var(--on-text); }
.pw { color: #F4F4F8; text-shadow: 0 1px 2px rgba(0,0,0,.8); } .pb { color: #0E0E14; text-shadow: 0 0 2px rgba(237,237,242,.45); }
.ck { width: 72%; aspect-ratio: 1; border-radius: 50%; display: block; }
.ck-w { background: #EDEDF2; box-shadow: inset 0 -4px 0 rgba(0,0,0,.22); }
.ck-b { background: #15151C; box-shadow: inset 0 0 0 2px rgba(237,237,242,.3), inset 0 -4px 0 rgba(0,0,0,.4); }
.ck.king { box-shadow: inset 0 0 0 5px var(--on-text), inset 0 -4px 0 rgba(0,0,0,.3); }
.ttt { flex: 1; min-height: 0; aspect-ratio: 1; max-width: 100%; display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); gap: 6px; }
.ttt button { border-radius: 10px; background: var(--s3); font: 700 clamp(20px, 12cqmin, 64px) var(--f-display); display: grid; place-items: center; }
.ttt button:hover:not(:disabled) { background: var(--s4); }
.ttt .o { color: var(--on-text); }
.ttt button.win-cell { background: color-mix(in srgb, var(--act) 35%, var(--s3)); }
.l4 { flex: 1; min-height: 0; aspect-ratio: 7 / 6; max-width: 100%; display: grid; grid-template: repeat(6, 1fr) / repeat(7, 1fr); gap: 5px; padding: 8px; border-radius: 12px; background: var(--s3); }
.l4 button { border-radius: 50%; background: var(--bg); }
.l4 button.p1 { background: #60A5FA; } .l4 button.p2 { background: #F472B6; }
.l4 button.win-cell { box-shadow: 0 0 0 3px var(--tx); }
.new-game { height: 34px; padding: 0 14px; border-radius: 8px; background: var(--s3); font-weight: 600; font-size: 13px; }
.new-game:hover { background: var(--s4); }
.note { position: absolute; inset: 0; padding: 30px 6px 6px; }
.note textarea { width: 100%; height: 100%; resize: none; border: 0; border-radius: 10px; background: var(--s2); color: var(--tx); font: 15px/1.5 var(--f-body); padding: 12px 14px; }
.note textarea::placeholder { color: var(--tx3); }
.canvas-wrap { position: absolute; inset: 0; background: #F3F3F7; }
.canvas-wrap canvas { width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }

/* Janelas de ferramenta: rádio, jam, tocando agora, times, placar, cronômetro */
.tool { position: absolute; inset: 0; padding: 32px 14px 14px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.tool-h { font: 600 11px var(--f-display); text-transform: uppercase; letter-spacing: .08em; color: var(--tx3); }
.btn { height: 34px; padding: 0 12px; border-radius: 8px; background: var(--s3); font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn:hover { background: var(--s4); }
.btn.primary { background: var(--act); color: #fff; }
.btn.primary:hover { background: var(--act-hover); }
.cover { width: 56px; height: 56px; border-radius: 8px; flex: none; }
.track { display: flex; gap: 12px; align-items: center; min-width: 0; }
.track b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.track small { color: var(--tx2); font-size: 12px; }
.prog { height: 4px; border-radius: 2px; background: var(--s4); position: relative; }
.prog i { position: absolute; inset: 0 auto 0 0; border-radius: 2px; background: var(--tx); }
.queue { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; min-height: 0; flex: 1; }
.queue li { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px; background: var(--s2); font-size: 13px; }
.queue li .av { width: 20px; height: 20px; font-size: 9px; margin-left: auto; }
.inline-form { display: flex; gap: 6px; }
.inline-form input { flex: 1; min-width: 0; height: 34px; border-radius: 8px; border: 0; background: var(--s2); color: var(--tx); padding: 0 10px; font: inherit; font-size: 13px; }
.inline-form input::placeholder { color: var(--tx3); }
.listening { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
.listening .track .cover { width: 40px; height: 40px; border-radius: 6px; }
.teams { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; min-height: 0; }
.team { border-radius: 10px; background: var(--s2); padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.team h4 { margin: 0 0 2px; font: 700 14px var(--f-display); }
.team span { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.team span i { width: 10px; height: 10px; border-radius: 50%; }
.score { flex: 1; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; container-type: size; }
.score .side { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.score input { width: 100%; text-align: center; background: none; border: 0; color: var(--tx2); font: 600 13px var(--f-body); }
.score .n { font: 700 clamp(28px, 30cqh, 96px) var(--f-display); font-variant-numeric: tabular-nums; line-height: 1; }
.score .x { color: var(--tx3); font: 700 20px var(--f-display); }
.score .pm { display: flex; gap: 4px; }
.score .pm .btn { width: 34px; padding: 0; }
.clock { flex: 1; display: grid; place-items: center; container-type: size; }
.clock output { font: 700 clamp(28px, 42cqh, 120px) var(--f-display); font-variant-numeric: tabular-nums; }
.row-btns { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }

/* Chat: coluna na Transmissão, painel flutuante na Mesa */
.chat-float { position: fixed; right: 16px; top: 64px; bottom: 92px; width: 300px; z-index: 50; background: var(--s1); border-radius: var(--r-lg); box-shadow: inset 0 0 0 1px var(--line2), var(--shadow-3); display: flex; flex-direction: column; overflow: hidden; }
.chat { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.chat-h { padding: 12px 16px 4px; font: 600 11px var(--f-display); text-transform: uppercase; letter-spacing: .08em; color: var(--tx3); }
.chat-log { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px 8px; display: flex; flex-direction: column; gap: 14px; }
.chat-log > :first-child { margin-top: auto; }
.msg { display: grid; grid-template-columns: 26px 1fr; gap: 10px; }
.msg .av { width: 26px; height: 26px; font-size: 11px; }
.msg b { font-weight: 600; font-size: 13px; }
.msg time { color: var(--tx3); font-size: 11px; margin-left: 6px; font-variant-numeric: tabular-nums; }
.msg p { margin: 0; color: #D3D7DD; font-size: 13px; overflow-wrap: anywhere; }
.sys { color: var(--tx3); font-size: 12px; text-align: center; }
.yt-offer { margin-top: 6px; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--on-text); padding: 6px 10px; border-radius: 8px; background: var(--s3); }
body[data-mode="tx"] .yt-offer { display: none; }
.compose { margin: 8px 10px 10px; display: flex; align-items: center; border-radius: var(--r-full); background: var(--s2); padding: 3px 3px 3px 14px; }
.compose input { flex: 1; min-width: 0; height: 34px; background: none; border: 0; color: var(--tx); font: inherit; font-size: 13px; }
.compose input::placeholder { color: var(--tx3); }
.compose input:focus-visible { box-shadow: none; }
.compose:focus-within { box-shadow: inset 0 0 0 1px var(--on-text); }
.compose button { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--tx2); }

/* Navegação da mesa: mapa + zoom (canto de baixo à esquerda) */
.nav { position: fixed; left: 16px; bottom: 16px; z-index: 50; display: flex; flex-direction: column; gap: 8px; }
.mini { position: relative; width: 192px; height: 120px; border-radius: 10px; background: var(--s1); box-shadow: inset 0 0 0 1px var(--line2), var(--shadow-2); overflow: hidden; cursor: pointer; }
.mini i { position: absolute; border-radius: 2px; background: var(--s4); }
.mini i.live { background: color-mix(in srgb, var(--live) 55%, var(--s4)); }
.mini .me { position: absolute; border: 1.5px solid var(--tx); border-radius: 3px; }
.mini .p { position: absolute; width: 6px; height: 6px; margin: -3px; border-radius: 50%; }
.zoom { display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 10px; background: var(--s1); box-shadow: inset 0 0 0 1px var(--line2); width: fit-content; }
.zoom button { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--tx2); }
.zoom button:hover { background: var(--s3); color: var(--tx); }
.zoom output { min-width: 46px; text-align: center; font-size: 12px; font-variant-numeric: tabular-nums; color: var(--tx2); }
.empty-hint { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; color: var(--tx2); pointer-events: none; z-index: 1; }
.empty-hint b { display: block; font: 700 22px var(--f-display); color: var(--tx); margin-bottom: 6px; }

/* ---------- Dock ---------- */
.chrome { transition: opacity 240ms var(--ease-out); }
body.idle .chrome { opacity: 0; pointer-events: none; }
.dock { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 60; display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: var(--r-full); background: var(--s2); box-shadow: 0 10px 30px rgba(0,0,0,.45), inset 0 0 0 1px var(--line); }
.db { height: 44px; min-width: 44px; padding: 0 14px; border-radius: var(--r-full); display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; color: var(--tx2); position: relative; }
.db:hover { background: var(--s3); color: var(--tx); }
.db.round { padding: 0; }
.db.primary { background: var(--act); color: #fff; }
.db.primary:hover { background: var(--act-hover); }
.db[aria-pressed="true"] { background: var(--tx); color: var(--bg); }
.db.leave { color: var(--danger-soft); }
.db.leave:hover { background: color-mix(in srgb, var(--danger) 22%, transparent); }
.db .tip { position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%); padding: 4px 10px; border-radius: 6px; background: var(--s4); color: var(--tx); font-size: 12px; font-weight: 500; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 120ms; }
.db:hover .tip, .db:focus-visible .tip { opacity: 1; }
.dsep { width: 1px; height: 22px; background: var(--line2); margin: 0 2px; }

/* Menus */
.pop, .ctx { z-index: 90; min-width: 230px; padding: 6px; border-radius: 12px; background: var(--s2); box-shadow: 0 18px 44px rgba(0,0,0,.55), inset 0 0 0 1px var(--line2); animation: pop 130ms var(--ease-out); }
.pop { position: absolute; top: calc(100% + 8px); right: 0; width: 290px; }
.ctx { position: fixed; }
@keyframes pop { from { opacity: 0; transform: translateY(4px) scale(.98); } }
.row { width: 100%; display: flex; align-items: center; gap: 10px; min-height: 38px; padding: 0 10px; border-radius: 8px; font-size: 13px; text-align: left; color: var(--tx); }
.row:hover, .row:focus-visible, .row.open { background: var(--s3); box-shadow: none; }
.row svg.i { color: var(--tx2); width: 16px; height: 16px; }
.row .glyph { width: 16px; text-align: center; color: var(--tx2); font-size: 16px; }
.row kbd, .row small { margin-left: auto; font: 500 11px var(--f-body); color: var(--tx3); }
.row .chev { margin-left: auto; }
.row.danger, .row.danger svg.i { color: var(--danger-soft); }
.pop label.row { cursor: pointer; }
.pop input { accent-color: var(--act); width: 16px; height: 16px; margin: 0; }
.menu-h { margin: 0; padding: 8px 10px 4px; font: 600 11px var(--f-display); text-transform: uppercase; letter-spacing: .08em; color: var(--tx3); }
hr.sep { border: 0; height: 1px; background: var(--line); margin: 6px 4px; }
.invite { display: flex; gap: 6px; padding: 2px 10px 8px; }
.invite code { flex: 1; font: 500 12px var(--f-body); font-variant-numeric: tabular-nums; color: var(--tx2); background: var(--s1); padding: 8px 10px; border-radius: 8px; white-space: nowrap; }
.invite button { font-size: 12px; font-weight: 600; color: var(--on-text); padding: 0 10px; border-radius: 8px; background: var(--s3); }

.toast { position: fixed; left: 50%; top: 64px; transform: translateX(-50%); z-index: 95; padding: 8px 14px; border-radius: var(--r-full); background: var(--s3); color: var(--tx); font-size: 13px; box-shadow: var(--shadow-2); display: flex; align-items: center; gap: 8px; opacity: 0; transition: opacity 200ms; pointer-events: none; white-space: nowrap; max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis; }
.toast.show { opacity: 1; }
.toast .d { width: 8px; height: 8px; border-radius: 50%; flex: none; }

@media (max-width: 900px) { .col { display: none; } .room small { display: none; } }
@media (max-width: 640px) { .avatars { display: none; } .db .lbl { display: none; } .db { padding: 0; width: 44px; } .mode button { padding: 0 10px; } .mode button .lbl-long { display: none; } .nav .mini { display: none; } .chat-float { left: 16px; width: auto; } .top { grid-template-columns: auto 1fr auto; } .room b { display: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<script>
(() => {
'use strict';
const $ = (id) => document.getElementById(id);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const WW = 4800, WH = 3000, GRID = 20, MINOR = 40, MAJOR = 200;

const people = {
  me:   { name: 'Nick', de: 'do', color: '#60A5FA', leader: true },
  rafa: { name: 'Rafa', de: 'do', color: '#4ADE80' },
  bia:  { name: 'Bia',  de: 'da', color: '#F472B6' },
  leo:  { name: 'Leo',  de: 'do', color: '#22D3EE' },
  duda: { name: 'Duda', de: 'da', color: '#FB923C' },
};
const I = {
  fs: '<svg class="i" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>',
  fsExit: '<svg class="i" viewBox="0 0 24 24"><path d="M8 3v3a2 2 0 0 1-2 2H3M21 8h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3M16 21v-3a2 2 0 0 1 2-2h3"/></svg>',
  x: '<svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  play: '<svg class="i" viewBox="0 0 24 24"><path d="M9 5v14l11-7z"/></svg>',
  pause: '<svg class="i" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>',
  send: '<svg class="i" viewBox="0 0 24 24"><path d="M22 2 11 13"/><path d="M22 2 15 22 11 13 2 9z"/></svg>',
  yt: '<svg class="i" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="4"/><path d="m10 9 5 3-5 3z"/></svg>',
  pencil: '<svg class="i" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  damas: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/></svg>',
  velha: '<svg class="i" viewBox="0 0 24 24"><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg>',
  lig4: '<svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8" cy="10" r="1.3"/><circle cx="12" cy="14" r="1.3"/><circle cx="16" cy="10" r="1.3"/><circle cx="8" cy="14" r="1.3"/></svg>',
  note: '<svg class="i" viewBox="0 0 24 24"><path d="M4 4h16v10l-6 6H4z"/><path d="M14 20v-6h6"/></svg>',
  plus: '<svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  chev: '<svg class="i chev" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>',
  front: '<svg class="i" viewBox="0 0 24 24"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M4 16V5a1 1 0 0 1 1-1h11"/></svg>',
  here: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>',
  music: '<svg class="i" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>',
  jam: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 10c2.5-1 5.5-1 8 .5M8.5 13c2-.7 4.5-.6 6.5.5M9 15.8c1.6-.5 3.3-.4 4.8.4"/></svg>',
  headph: '<svg class="i" viewBox="0 0 24 24"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1v-6h3zM3 19a2 2 0 0 0 2 2h1v-6H3z"/></svg>',
  shuffle: '<svg class="i" viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>',
  trophy: '<svg class="i" viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>',
  timer: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg>',
  fit: '<svg class="i" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>',
};

const T = {
  screen: { video: true, aspect: 16 / 9, min: 320, size: 960 },
  camera: { video: true, aspect: 16 / 9, min: 160, size: 320 },
  youtube:{ aspect: 16 / 9, min: 320, size: 720, title: 'Vídeo do YouTube' },
  chess:  { aspect: 1, min: 300, size: 520, title: 'Xadrez' },
  damas:  { aspect: 1, min: 300, size: 520, title: 'Damas' },
  velha:  { aspect: 5 / 6, min: 240, size: 360, title: 'Jogo da velha' },
  lig4:   { aspect: 1, min: 300, size: 480, title: 'Lig 4' },
  board:  { aspect: 16 / 10, min: 320, size: 640, title: 'Quadro' },
  note:   { min: 200, minH: 140, size: 300, h: 220, title: 'Nota' },
  radio:  { min: 300, minH: 280, size: 380, h: 360, title: 'Rádio da sala' },
  jam:    { min: 280, minH: 220, size: 340, h: 240, title: 'Spotify Jam' },
  agora:  { min: 280, minH: 200, size: 340, h: 280, title: 'Tocando agora' },
  times:  { min: 300, minH: 240, size: 420, h: 300, title: 'Sorteio de times' },
  placar: { min: 300, minH: 180, size: 420, h: 220, title: 'Placar' },
  crono:  { min: 240, minH: 180, size: 320, h: 220, title: 'Cronômetro' },
};
const CATALOG = [
  ['Assistir e ouvir', [['youtube', () => I.yt, 'toca junto'], ['radio', () => I.music, 'fila do YouTube'], ['jam', () => I.jam, 'link do Jam'], ['agora', () => I.headph, 'quem ouve o quê']]],
  ['Jogos', [['chess', () => '<span class="glyph">♞︎</span>'], ['damas', () => I.damas], ['velha', () => I.velha], ['lig4', () => I.lig4]]],
  ['Noite de jogo', [['times', () => I.shuffle], ['placar', () => I.trophy], ['crono', () => I.timer]]],
  ['Ferramentas', [['board', () => I.pencil], ['note', () => I.note]]],
];
const nameOf = (w) => ({ screen: `Tela ${people[w.owner].de} ${people[w.owner].name}`, camera: `Câmera ${people[w.owner].de} ${people[w.owner].name}` })[w.type] || T[w.type].title;

/* ---------- Estado da sala ---------- */
let mode = 'tx', leaderOnly = false, seq = 0, zTop = 10;
const wins = [];
const mk = (type, owner, x, y, w) => { const t = T[type]; const ww = w || t.size; return { id: 'w' + (++seq), type, owner, x, y, w: ww, h: t.aspect ? ww / t.aspect : (t.h || 240), z: ++zTop, el: null }; };
const CX = WW / 2, CY = WH / 2;
wins.push(mk('screen', 'rafa', CX - 480, CY - 300), mk('camera', 'bia', CX + 500, CY - 300), mk('camera', 'leo', CX + 500, CY - 100));

/* ---------- Toast e anúncio ---------- */
let tt;
function say(text, who) {
  $('live').textContent = text; $('toast-t').textContent = text;
  $('toast-d').style.background = who ? people[who].color : 'var(--tx2)';
  $('toast').classList.add('show'); clearTimeout(tt); tt = setTimeout(() => $('toast').classList.remove('show'), 2600);
}

/* ---------- Chat (um só; mora na coluna ou no painel flutuante) ---------- */
const chat = document.createElement('div'); chat.className = 'chat';
chat.innerHTML = `<div class="chat-h">Chat</div><div class="chat-log" role="log"></div><form class="compose"><label class="vh" for="chat-in">Mensagem para a sala</label><input id="chat-in" autocomplete="off" placeholder="Escreva pra sala…"><button type="submit" aria-label="Enviar mensagem">${I.send}</button></form>`;
const log = chat.querySelector('.chat-log');
function hhmm() { const t = new Date(); return `${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}`; }
function post(who, text) {
  const d = document.createElement('div'); d.className = 'msg';
  d.innerHTML = `<span class="av" style="background:${people[who].color}">${people[who].name[0]}</span><div><b>${people[who].name}</b><time>${hhmm()}</time><p></p></div>`;
  d.querySelector('p').textContent = text;
  if (/youtu\.?be/.test(text)) { const b = document.createElement('button'); b.type = 'button'; b.className = 'yt-offer'; b.innerHTML = `${I.yt}Pôr na mesa`; b.onclick = () => { const w = addWin('youtube', 'me', viewCenter()); w.play?.(true); }; d.lastElementChild.appendChild(b); }
  log.appendChild(d); log.scrollTop = log.scrollHeight;
}
function sys(text) { const d = document.createElement('div'); d.className = 'sys'; d.textContent = text; log.appendChild(d); log.scrollTop = log.scrollHeight; }
chat.querySelector('form').onsubmit = (e) => { e.preventDefault(); const i = $('chat-in'); if (i.value.trim()) post('me', i.value.trim()); i.value = ''; };
let chatOpen = true;
function placeChat() {
  const host = mode === 'tx' ? $('col') : $('chat-float');
  host.appendChild(chat);
  $('col').hidden = !chatOpen; $('chat-float').hidden = !chatOpen || mode !== 'mesa';
  $('b-chat').setAttribute('aria-pressed', String(chatOpen));
}
$('b-chat').onclick = () => { chatOpen = !chatOpen; placeChat(); };

/* ---------- Conteúdo de uma tela/câmera (usado nos dois modos) ---------- */
function mediaHTML(w) {
  const p = people[w.owner];
  if (w.type === 'screen') return `<div class="screen-fake${w.owner === 'me' ? ' mine' : ''}">${w.owner === 'me' ? '' : '<div class="hud-map"></div><div class="hud-hp"></div><div class="xhair"></div>'}</div><div class="label"><span class="live">AO VIVO</span><span>${p.name}</span></div>`;
  return `<div class="cam" style="--who:${p.color}"><div class="face">${p.name[0]}</div></div><div class="label"><span>${p.name}</span></div>`;
}

/* ================= MODO TRANSMISSÃO: o layout de hoje ================= */
function renderTx() {
  const media = wins.filter((w) => w.type === 'screen' || w.type === 'camera');
  const main = media.find((w) => w.type === 'screen') || media[0];
  const tile = (w) => `<div class="tile" tabindex="0" aria-label="${nameOf(w)}">${mediaHTML(w)}<button class="fs" type="button" aria-label="Tela cheia">${I.fs}</button></div>`;
  $('tx-main').innerHTML = main ? tile(main) : '<p class="stage-empty">Ninguém está transmitindo.</p>';
  $('tx-strip').innerHTML = media.filter((w) => w !== main).map(tile).join('');
  $('tx-strip').hidden = media.length < 2;
  document.querySelectorAll('#view-tx .fs').forEach((b) => b.onclick = () => { const t = b.closest('.tile'); (t.requestFullscreen?.() || Promise.reject()).catch(() => say('Tela cheia indisponível aqui')); });
}

/* ================= MODO MESA ================= */
const mv = $('view-mesa'), world = $('world'), gridBg = $('grid-bg');
Object.assign($('world-edge').style, { width: WW + 'px', height: WH + 'px' });
const cam = { x: CX - 800, y: CY - 500, z: 1 };
function vp() { return { w: mv.clientWidth, h: mv.clientHeight }; }
function viewCenter() { const v = vp(); return { x: cam.x + v.w / 2 / cam.z, y: cam.y + v.h / 2 / cam.z }; }
function toWorld(e) { return { x: cam.x + e.clientX / cam.z, y: cam.y + e.clientY / cam.z }; }
function clampCam() { const v = vp(); const m = 600; cam.x = clamp(cam.x, -m, WW + m - v.w / cam.z); cam.y = clamp(cam.y, -m, WH + m - v.h / cam.z); }
let miniQueued = false;
function applyCam() {
  world.style.transform = `translate(${-cam.x * cam.z}px, ${-cam.y * cam.z}px) scale(${cam.z})`;
  const mi = MINOR * cam.z, ma = MAJOR * cam.z;
  const ox = -cam.x * cam.z, oy = -cam.y * cam.z;
  const layers = [`linear-gradient(var(--grid2) 1px, transparent 1px)`, `linear-gradient(90deg, var(--grid2) 1px, transparent 1px)`];
  const sizes = [`${ma}px ${ma}px`, `${ma}px ${ma}px`];
  if (mi >= 14) { layers.push(`linear-gradient(var(--grid) 1px, transparent 1px)`, `linear-gradient(90deg, var(--grid) 1px, transparent 1px)`); sizes.push(`${mi}px ${mi}px`, `${mi}px ${mi}px`); }
  gridBg.style.backgroundImage = layers.join(',');
  gridBg.style.backgroundSize = sizes.join(',');
  gridBg.style.backgroundPosition = layers.map(() => `${ox}px ${oy}px`).join(',');
  $('z-val').textContent = Math.round(cam.z * 100) + '%';
